name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM 单测（发现 / 信令）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 准备 Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 运行纯 JVM 单元测试
        run: gradle :core:discovery:test :core:signal:test --continue --stacktrace --no-daemon
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 准备 Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 接受 Android SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: 构建 debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: 发布 APK 到 Release（手机可直接下载）
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-build-${{ github.run_number }}
          name: Mirror build #${{ github.run_number }}
          body: |
            自动构建的 debug APK，可直接安装到 Android 手机（需允许安装未知来源应用）。

            当前阶段：切片 01 骨架就绪 —— 工程已切换为 WebRTC 传输与媒体栈，
            屏幕采集发布与接收端渲染在后续切片落地（见 .scratch/mirror/issues/）。
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
