name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM 单测（发现 / 信令）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 准备 Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 运行纯 JVM 单元测试
        run: gradle :core:discovery:test :core:signal:test --continue --stacktrace --no-daemon
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 准备 Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 接受 Android SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: 构建 debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mirror-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 版本号从 1.0 起算：历史 Release 已清空，这一版就是第一版。
      # 基准取"清空之后那一次构建的 run 号"，于是它得到 v1.0，之后 v1.1、v1.2…
      - name: 计算版本号
        id: ver
        run: echo "minor=$(( ${{ github.run_number }} - 105 ))" >> "$GITHUB_OUTPUT"

      - name: 发布 APK 到 Release（手机可直接下载）
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ steps.ver.outputs.minor }}
          name: Mirror v1.${{ steps.ver.outputs.minor }}
          body: |
            自动构建的 debug APK，可直接安装到 Android 手机（需允许安装未知来源应用）。

            两台设备连同一个 Wi-Fi 时：接收端出二维码，发送端扫码即可投屏。
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true